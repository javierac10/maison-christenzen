<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente dorado de alta costura -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F1E0" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6B500C" />
    </linearGradient>

    <!-- Sombra sutil para profundidad -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo circular escuro e elegante -->
  <circle cx="256" cy="256" r="240" fill="#0D131F" stroke="url(#goldGradient)" stroke-width="4" />

  <!-- Monograma MC Entrelazado -->
  <g filter="url(#subtleGlow)" fill="none" stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Letra M -->
    <path d="M 130 360 L 130 160 L 220 310 L 292 185" stroke-width="26"/>

    <!-- Letra C (Entrelazada en el centro-derecha) -->
    <path d="M 380 195 C 330 135, 210 160, 210 256 C 210 352, 330 377, 380 317" stroke-width="26"/>

    <!-- Detalle de alta costura: Serifas finas -->
    <!-- Base M Izquierda -->
    <path d="M 110 360 L 150 360" stroke-width="12" />
    <!-- Top M Izquierda -->
    <path d="M 110 160 L 150 160" stroke-width="12" />
    <!-- Remate C Superior -->
    <circle cx="378" cy="197" r="8" fill="url(#goldGradient)" stroke="none" />
    <!-- Remate C Inferior -->
    <circle cx="378" cy="315" r="8" fill="url(#goldGradient)" stroke="none" />

  </g>
</svg>
